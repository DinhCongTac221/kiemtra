<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dịch & Chỉnh Sửa</title>
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --vi: #ea4335; --ja: #1a73e8; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
        
        .container { 
            width: 100%; max-width: 450px; background: var(--card); 
            padding: 20px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            min-height: 85vh; display: flex; flex-direction: column; 
        }

        .button-group { display: flex; gap: 10px; margin-bottom: 10px; }
        
        .btn { 
            flex: 1; padding: 12px 5px; font-size: 14px; font-weight: bold; 
            cursor: pointer; border: none; border-radius: 12px; transition: 0.2s; 
            color: white; -webkit-tap-highlight-color: transparent;
        }
        .btn-vi { background: var(--vi); }
        .btn-ja { background: var(--ja); }
        .btn-stop { background: #3c4043 !important; animation: pulse 1.2s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        #status { height: 25px; font-size: 12px; color: #5f6368; font-weight: bold; text-align: center; margin-bottom: 10px; }
        
        .result-area { 
            background: #f8f9fa; border-radius: 18px; padding: 18px; 
            text-align: left; margin-top: 10px; border: 1px solid #e8eaed; 
            position: relative; flex-grow: 1;
        }
        
        .label { font-size: 10px; color: #70757a; text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 5px; }
        
        /* Cho phép chỉnh sửa văn bản nguồn */
        .editable-text {
            width: 100%; border: 1px dashed #ccc; border-radius: 8px;
            padding: 8px; font-size: 18px; color: #5f6368; line-height: 1.4;
            background: #fff; box-sizing: border-box; outline: none;
            min-height: 60px; margin-bottom: 15px; display: block;
        }
        .editable-text:focus { border-color: var(--ja); background: #f0f7ff; }
        
        .text-target { 
            font-size: 32px; color: #188038; font-weight: 800; 
            display: block; margin-top: 10px; line-height: 1.3; 
            padding-right: 45px; word-break: break-word;
        }

        .play-btn { 
            position: absolute; right: 15px; bottom: 15px; 
            background: white; border: 1px solid #ddd; border-radius: 50%; 
            width: 45px; height: 45px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: 22px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin:0 0 10px 0; font-size: 18px; text-align: center;">Dịch & Chỉnh sửa chính tả</h2>
    <div id="status">Sẵn sàng</div>
    
    <div class="button-group">
        <button id="btnVI" class="btn btn-vi" onclick="toggleRecognition('vi-VN', 'ja')">🇻🇳 Tiếng Việt</button>
        <button id="btnJA" class="btn btn-ja" onclick="toggleRecognition('ja-JP', 'vi')">🇯🇵 Tiếng Nhật</button>
    </div>

    <div class="result-area">
        <span class="label">Nguồn (Có thể gõ để sửa):</span>
        <textarea id="originalText" class="editable-text" oninput="manualUpdate()" placeholder="Nội dung nói sẽ hiện ở đây..."></textarea>
        
        <hr style="border:0; border-top:1px solid #eee; margin:10px 0;">
        
        <span class="label">Kết quả dịch:</span>
        <span id="translatedText" class="text-target">...</span>
        <button class="play-btn" onclick="replayAudio()">🔊</button>
    </div>
</div>

<script>
    let isRecording = false;
    let lastResult = "";
    let lastTargetLang = "";
    let typingTimer; // Biến chờ người dùng gõ xong mới dịch
    
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.continuous = true;
    recognition.interimResults = false;

    let srcLang = '', targetLang = '';

    function toggleRecognition(langIn, langOut) {
        const btnVI = document.getElementById('btnVI');
        const btnJA = document.getElementById('btnJA');

        if (!isRecording) {
            srcLang = langIn; targetLang = langOut;
            recognition.lang = langIn;
            recognition.start();
            isRecording = true;
            document.getElementById('status').innerText = "🔴 ĐANG NGHE...";
            
            if(langIn === 'vi-VN') {
                btnVI.innerText = "DỪNG";
                btnVI.classList.add('btn-stop');
                btnJA.style.visibility = 'hidden';
            } else {
                btnJA.innerText = "DỪNG";
                btnJA.classList.add('btn-stop');
                btnVI.style.visibility = 'hidden';
            }
        } else {
            recognition.stop();
        }
    }

    recognition.onresult = (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript;
        document.getElementById('originalText').value = transcript;
        translateMyMemory(transcript, srcLang, targetLang);
    };

    // Hàm xử lý khi người dùng tự gõ sửa
    function manualUpdate() {
        clearTimeout(typingTimer);
        const text = document.getElementById('originalText').value;
        if (!text) return;

        document.getElementById('status').innerText = "✍️ Bạn đang chỉnh sửa...";
        // Chờ 1 giây sau khi ngừng gõ mới tự động dịch lại
        typingTimer = setTimeout(() => {
            translateMyMemory(text, srcLang || 'vi-VN', targetLang || 'ja');
        }, 1000);
    }

    recognition.onend = () => {
        isRecording = false;
        resetUI();
    };

    function resetUI() {
        document.getElementById('btnVI').innerText = "🇻🇳 Tiếng Việt";
        document.getElementById('btnJA').innerText = "🇯🇵 Tiếng Nhật";
        document.getElementById('btnVI').classList.remove('btn-stop');
        document.getElementById('btnJA').classList.remove('btn-stop');
        document.getElementById('btnVI').style.visibility = 'visible';
        document.getElementById('btnJA').style.visibility = 'visible';
    }

    async function translateMyMemory(text, from, to) {
        document.getElementById('status').innerText = "⏳ Đang dịch...";
        const langPair = `${from.split('-')[0]}|${to}`;
        
        try {
            const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`);
            const data = await response.json();
            let result = data.responseData.translatedText;

            document.getElementById('translatedText').innerText = result;
            document.getElementById('status').innerText = "✅ Đã cập nhật!";
            
            lastResult = result;
            lastTargetLang = to;
            // Chỉ tự động phát âm nếu không phải đang gõ tay (để tránh phiền)
            if (!isRecording) replayAudio(); 

        } catch (err) {
            document.getElementById('status').innerText = "❌ Lỗi kết nối";
        }
    }

    function replayAudio() {
        if (!lastResult) return;
        window.speechSynthesis.cancel(); // Dừng các âm thanh đang phát cũ
        const speak = new SpeechSynthesisUtterance(lastResult);
        speak.lang = lastTargetLang === 'ja' ? 'ja-JP' : 'vi-VN';
        window.speechSynthesis.speak(speak);
    }
</script>

</body>
</html>
