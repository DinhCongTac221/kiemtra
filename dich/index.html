<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Translator Mobile</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 20px; background-color: #f0f2f5; margin: 0; }
        .container { max-width: 100%; margin: auto; background: white; padding: 30px 20px; border-radius: 20px; min-height: 90vh; box-sizing: border-box; }
        h2 { color: #1a73e8; margin-bottom: 30px; }
        .btn { width: 100%; padding: 20px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 15px; margin: 10px 0; display: block; }
        .btn-vi { background-color: #ea4335; color: white; }
        .btn-ja { background-color: #1a73e8; color: white; }
        #status { height: 24px; color: #5f6368; margin: 15px 0; font-weight: 500; }
        .result-area { background: #f8f9fa; border-radius: 15px; padding: 15px; text-align: left; margin-top: 20px; }
        .label { font-size: 12px; color: #70757a; text-transform: uppercase; display: block; margin-bottom: 5px; }
        .text { font-size: 18px; color: #202124; min-height: 25px; margin-bottom: 15px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dịch Giọng Nói</h2>
    <div id="status">Sẵn sàng!</div>
    
    <button class="btn btn-vi" onclick="startRecognition('vi-VN', 'ja')">🇻🇳 Nói tiếng Việt</button>
    <button class="btn btn-ja" onclick="startRecognition('ja-JP', 'vi')">🇯🇵 Nói tiếng Nhật</button>

    <div class="result-area">
        <span class="label">Nguồn:</span>
        <span id="originalText" class="text">...</span>
        <hr style="border: 0.5px solid #ddd">
        <span class="label">Dịch:</span>
        <span id="translatedText" class="text" style="color: #188038; font-weight: bold;">...</span>
    </div>
</div>

<script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;

    async function startRecognition(langInput, langTarget) {
        try {
            recognition.lang = langInput;
            recognition.start();
            document.getElementById('status').innerText = "🔴 Đang nghe...";
        } catch (e) {
            alert("Lỗi Micro: " + e.message);
        }

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('originalText').innerText = transcript;
            document.getElementById('status').innerText = "⏳ Đang dịch...";

            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(transcript)}&langpair=${langInput.split('-')[0]}|${langTarget}`);
                const data = await res.json();
                const result = data.responseData.translatedText;
                
                document.getElementById('translatedText').innerText = result;
                document.getElementById('status').innerText = "✅ Xong!";
                
                // Đọc kết quả
                const utterance = new SpeechSynthesisUtterance(result);
                utterance.lang = langTarget === 'ja' ? 'ja-JP' : 'vi-VN';
                window.speechSynthesis.speak(utterance);
            } catch (err) {
                alert("Lỗi dịch thuật!");
            }
        };

        recognition.onspeechend = () => recognition.stop();
        recognition.onerror = () => {
            document.getElementById('status').innerText = "❌ Lỗi không nghe được";
        };
    }
</script>

</body>
</html>
