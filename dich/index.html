<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini Voice Translator</title>
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px 20px; border-radius: 20px; min-height: 90vh; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .btn { width: 100%; padding: 20px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 15px; margin: 10px 0; transition: 0.3s; }
        .btn-vi { background-color: #ea4335; color: white; }
        .btn-ja { background-color: #1a73e8; color: white; }
        .btn-stop { background-color: #34495e !important; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        #status { height: 24px; color: #5f6368; margin: 15px 0; font-weight: bold; font-size: 14px; }
        .result-area { background: #f8f9fa; border-radius: 15px; padding: 15px; text-align: left; margin-top: 20px; }
        .text { font-size: 20px; color: #202124; display: block; margin-top: 10px; line-height: 1.6; }
        .label { font-size: 11px; color: #70757a; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gemini Translator</h2>
    <div id="status">Sẵn sàng</div>
    
    <button id="btnVI" class="btn btn-vi" onclick="toggleRecognition('vi-VN', 'ja')">🇻🇳 Nói tiếng Việt</button>
    <button id="btnJA" class="btn btn-ja" onclick="toggleRecognition('ja-JP', 'vi')">🇯🇵 Nói tiếng Nhật</button>

    <div class="result-area">
        <span class="label">Nguồn:</span>
        <span id="originalText" class="text">...</span>
        <hr style="border: 0; border-top: 1px solid #ddd; margin: 15px 0;">
        <span class="label">Kết quả (Dạng chữ dễ đọc):</span>
        <span id="translatedText" class="text" style="color: #188038;">...</span>
    </div>
</div>

<script>
    // --- CẤU HÌNH GEMINI ---
    const API_KEY = "AIzaSyDx3hdUwDbmADA0cNCWplSaI4H9Mzm7TT8"; 
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    let isRecording = false;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    
    recognition.continuous = true;
    recognition.interimResults = false;

    let currentLangInput = '';
    let currentLangTarget = '';

    function toggleRecognition(langInput, langTarget) {
        const btnVI = document.getElementById('btnVI');
        const btnJA = document.getElementById('btnJA');

        if (!isRecording) {
            currentLangInput = langInput;
            currentLangTarget = langTarget;
            recognition.lang = langInput;
            recognition.start();
            isRecording = true;
            
            document.getElementById('status').innerText = "🔴 ĐANG NGHE... BẤM NÚT NÀY ĐỂ DỪNG";
            if(langInput === 'vi-VN') {
                btnVI.innerText = "DỪNG VÀ DỊCH";
                btnVI.classList.add('btn-stop');
                btnJA.style.visibility = 'hidden';
            } else {
                btnJA.innerText = "DỪNG VÀ DỊCH";
                btnJA.classList.add('btn-stop');
                btnVI.style.visibility = 'hidden';
            }
        } else {
            recognition.stop();
        }
    }

    recognition.onresult = (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript;
        document.getElementById('originalText').innerText = transcript;
        callGemini(transcript, currentLangInput, currentLangTarget);
    };

    recognition.onend = () => {
        isRecording = false;
        resetButtons();
    };

    function resetButtons() {
        const btnVI = document.getElementById('btnVI');
        const btnJA = document.getElementById('btnJA');
        btnVI.innerText = "🇻🇳 Nói tiếng Việt";
        btnJA.innerText = "🇯🇵 Nói tiếng Nhật";
        btnVI.classList.remove('btn-stop');
        btnJA.classList.remove('btn-stop');
        btnVI.style.visibility = 'visible';
        btnJA.style.visibility = 'visible';
    }

    async function callGemini(text, source, target) {
        document.getElementById('status').innerText = "⏳ Gemini đang xử lý...";
        
        let prompt = "";
        if (target === 'ja') {
            prompt = `Dịch câu này sang tiếng Nhật: "${text}". Yêu cầu: CHỈ TRẢ VỀ CHỮ HIRAGANA VÀ KATAKANA, TUYỆT ĐỐI KHÔNG DÙNG CHỮ KANJI.`;
        } else {
            prompt = `Dịch câu tiếng Nhật này sang tiếng Việt: "${text}". Trả về bản dịch ngắn gọn tự nhiên.`;
        }

        try {
            const response = await fetch(GEMINI_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            const result = data.candidates[0].content.parts[0].text.trim();
            
            document.getElementById('translatedText').innerText = result;
            document.getElementById('status').innerText = "✅ Xong!";
            
            // Phát âm
            const utterance = new SpeechSynthesisUtterance(result);
            utterance.lang = target === 'ja' ? 'ja-JP' : 'vi-VN';
            window.speechSynthesis.speak(utterance);

        } catch (err) {
            document.getElementById('status').innerText = "Lỗi API Gemini!";
            console.error(err);
        }
    }
</script>

</body>
</html>
