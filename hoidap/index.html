<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Học Tiếng Nhật Cùng Gemini</title>
    <style>
        :root { --primary: #1a73e8; --secondary: #34a853; --bg: #f8f9fa; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); min-height: 90vh; display: flex; flex-direction: column; }
        
        .header { text-align: center; margin-bottom: 15px; }
        .header h2 { margin: 0; color: var(--primary); font-size: 20px; }
        
        .voice-btn { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 12px; background: var(--primary); color: white; margin-bottom: 10px; transition: 0.2s; }
        .recording { background: #d93025 !important; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .input-area { margin-top: 10px; flex-grow: 0; }
        .label { font-size: 11px; font-weight: bold; color: #70757a; text-transform: uppercase; margin-bottom: 5px; display: block; }
        
        /* Ô nhập liệu có thể sửa */
        textarea { width: 100%; height: 80px; padding: 12px; border: 1px solid #dadce0; border-radius: 10px; font-size: 16px; box-sizing: border-box; resize: none; outline: none; font-family: inherit; }
        textarea:focus { border-color: var(--primary); background: #fdfdfd; }

        .send-btn { width: 100%; padding: 12px; margin-top: 10px; background: var(--secondary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .response-area { margin-top: 20px; padding: 15px; background: #f1f3f4; border-radius: 15px; flex-grow: 1; overflow-y: auto; border-left: 5px solid var(--secondary); }
        .response-text { font-size: 18px; line-height: 1.6; color: #202124; white-space: pre-wrap; }
        #status { font-size: 12px; text-align: center; color: #5f6368; margin-top: 5px; height: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Hỏi Đáp Tiếng Nhật (AI)</h2>
        <div id="status">Sẵn sàng</div>
    </div>

    <button id="micBtn" class="voice-btn" onclick="toggleMic()">🎤 Nhấn để nói câu hỏi</button>

    <div class="input-area">
        <span class="label">Câu hỏi của bạn (Sửa nếu sai):</span>
        <textarea id="userInput" placeholder="Ví dụ: Cách chia thể Te..."></textarea>
        <button class="send-btn" onclick="askGemini()">Gửi câu hỏi cho AI →</button>
    </div>

    <div class="response-area">
        <span class="label">Giải đáp ngắn gọn:</span>
        <div id="aiResponse" class="response-text">...</div>
    </div>
</div>

<script>
    // --- CẤU HÌNH API ---
    const API_KEY = "AIzaSyDlASALYkTd42wto5fkpeUMA8wATm0o0KQ"; 
    const MODEL = "gemini-2.5-flash"; // Dùng model mới nhất từ dữ liệu của bạn
    const URL = `https://generativelanguage.googleapis.com/v1/models/${MODEL}:generateContent?key=${API_KEY}`;

    let isRecording = false;
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'vi-VN';
    recognition.continuous = false;

    // 1. Xử lý giọng nói
    function toggleMic() {
        if (!isRecording) {
            recognition.start();
            document.getElementById('micBtn').innerText = "🔴 Đang nghe... Nhấn để dừng";
            document.getElementById('micBtn').classList.add('recording');
            isRecording = true;
        } else {
            recognition.stop();
        }
    }

    recognition.onresult = (event) => {
        const result = event.results[0][0].transcript;
        document.getElementById('userInput').value = result;
    };

    recognition.onend = () => {
        isRecording = false;
        document.getElementById('micBtn').innerText = "🎤 Nhấn để nói câu hỏi";
        document.getElementById('micBtn').classList.remove('recording');
    };

    // 2. Gọi Gemini xử lý học thuật
    async function askGemini() {
        const question = document.getElementById('userInput').value;
        const responseBox = document.getElementById('aiResponse');
        const status = document.getElementById('status');

        if (!question.trim()) return alert("Vui lòng nhập câu hỏi!");

        status.innerText = "⏳ Gemini đang suy nghĩ...";
        responseBox.innerText = "Đang tải...";

        // Prompt ép AI trả lời kiểu "Tóm tắt ngữ pháp"
        const finalPrompt = `Bạn là một trợ lý dạy tiếng Nhật thông minh. 
        Câu hỏi: "${question}"
        Yêu cầu: Trả lời thật ngắn gọn, tóm tắt quy tắc ngữ pháp dưới dạng gạch đầu dòng hoặc bảng. 
        TUYỆT ĐỐI KHÔNG giải thích dài dòng, không chào hỏi, chỉ đưa ra kiến thức trọng tâm.`;

        try {
            const response = await fetch(URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: finalPrompt }] }],
                    generationConfig: { temperature: 0.1, maxOutputTokens: 500 }
                })
            });

            const data = await response.json();
            const result = data.candidates[0].content.parts[0].text.trim().replace(/\*/g, '');
            
            responseBox.innerText = result;
            status.innerText = "✅ Đã giải đáp!";

        } catch (err) {
            status.innerText = "❌ Lỗi API!";
            responseBox.innerText = "Không thể kết nối với AI. Hãy kiểm tra API Key.";
        }
    }
</script>

</body>
</html>
