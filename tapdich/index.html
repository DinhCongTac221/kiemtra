<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siêu Dịch Thuật Gemini 2.5</title>
    <style>
        :root { --bg: #f0f2f5; --card: #ffffff; --vi: #ea4335; --ja: #1a73e8; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background: var(--card); padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); min-height: 85vh; display: flex; flex-direction: column; }
        h2 { font-size: 22px; margin: 0 0 10px 0; color: #202124; }
        #status { height: 30px; font-size: 13px; color: #5f6368; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
        
        .btn { width: 100%; padding: 20px; font-size: 17px; font-weight: bold; cursor: pointer; border: none; border-radius: 16px; margin: 8px 0; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        .btn-vi { background: var(--vi); color: white; }
        .btn-ja { background: var(--ja); color: white; }
        .btn-stop { background: #3c4043 !important; color: white; animation: pulse 1.2s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        
        .result-area { background: #f8f9fa; border-radius: 18px; padding: 18px; text-align: left; margin-top: auto; border: 1px solid #e8eaed; }
        .label { font-size: 10px; color: #70757a; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .text { font-size: 20px; color: #202124; display: block; margin-top: 8px; line-height: 1.4; min-height: 1.4em; }
        #translatedText { color: #188038; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dịch Giọng Nói</h2>
    <div id="status">Sẵn sàng</div>
    
    <button id="btnVI" class="btn btn-vi" onclick="toggleRecognition('vi-VN', 'ja')">🇻🇳 Nói tiếng Việt</button>
    <button id="btnJA" class="btn btn-ja" onclick="toggleRecognition('ja-JP', 'vi')">🇯🇵 Nói tiếng Nhật</button>

    <div class="result-area">
        <span class="label">Nguồn:</span>
        <span id="originalText" class="text">...</span>
        <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
        <span class="label">Dịch (Ngắn gọn):</span>
        <span id="translatedText" class="text">...</span>
    </div>
</div>

<script>
    // 1. CẤU HÌNH API
    const API_KEY = "AIzaSyDzeg7qU9k-vaRO2Ol8Qu9iwWyFW_IRU3o"; 
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=${API_KEY}`;

    let isRecording = false;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    
    recognition.continuous = true;
    recognition.interimResults = false;

    let srcLang = '', targetLang = '';

    function toggleRecognition(langIn, langOut) {
        const btnVI = document.getElementById('btnVI');
        const btnJA = document.getElementById('btnJA');

        if (!isRecording) {
            srcLang = langIn; targetLang = langOut;
            recognition.lang = langIn;
            recognition.start();
            isRecording = true;
            document.getElementById('status').innerText = "🔴 ĐANG NGHE... NHẤN NÚT ĐỂ DỪNG";
            
            if(langIn === 'vi-VN') {
                btnVI.innerText = "DỪNG VÀ DỊCH NGAY";
                btnVI.classList.add('btn-stop');
                btnJA.style.visibility = 'hidden';
            } else {
                btnJA.innerText = "DỪNG VÀ DỊCH NGAY";
                btnJA.classList.add('btn-stop');
                btnVI.style.visibility = 'hidden';
            }
        } else {
            recognition.stop();
        }
    }

    recognition.onresult = (event) => {
        const transcript = event.results[event.results.length - 1][0].transcript;
        document.getElementById('originalText').innerText = transcript;
        callGemini(transcript);
    };

    recognition.onend = () => {
        isRecording = false;
        resetUI();
    };

    function resetUI() {
        const btnVI = document.getElementById('btnVI');
        const btnJA = document.getElementById('btnJA');
        btnVI.innerText = "🇻🇳 Nói tiếng Việt";
        btnJA.innerText = "🇯🇵 Nói tiếng Nhật";
        btnVI.classList.remove('btn-stop');
        btnJA.classList.remove('btn-stop');
        btnVI.style.visibility = 'visible';
        btnJA.style.visibility = 'visible';
    }

    async function callGemini(text) {
        document.getElementById('status').innerText = "⏳ Đang dịch...";
        
        // Prompt cực ngắn để AI phản hồi nhanh
        const prompt = targetLang === 'ja' 
            ? `Dịch sang tiếng Nhật (KHÔNG KANJI, CHỈ HIRAGANA/KATAKANA): "${text}". Trả về duy nhất câu dịch.`
            : `Dịch sang tiếng Việt ngắn gọn: "${text}". Trả về duy nhất câu dịch, không giải thích.`;

        try {
            const response = await fetch(GEMINI_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0, topP: 1, maxOutputTokens: 100 }
                })
            });

            const data = await response.json();
            let result = data.candidates[0].content.parts[0].text.trim().replace(/\*/g, '');
            
            document.getElementById('translatedText').innerText = result;
            document.getElementById('status').innerText = "✅ Xong!";
            
            const speak = new SpeechSynthesisUtterance(result);
            speak.lang = targetLang === 'ja' ? 'ja-JP' : 'vi-VN';
            window.speechSynthesis.speak(speak);

        } catch (err) {
            document.getElementById('status').innerText = "❌ Lỗi kết nối";
        }
    }
</script>

</body>
</html>
